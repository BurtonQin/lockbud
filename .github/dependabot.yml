version: 2
updates:
  # Root crate only; the toys/ crates are fixed test fixtures and are not auto-bumped.
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
